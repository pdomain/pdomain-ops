[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pdomain-ops"
dynamic = ["version"]
description = "Suite plumbing and GPU dispatch adapters for the pdomain-* suite"
authors = [
    { name = "CT", email = "concavetrillion@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "eventsourcing>=9.4,<10",
    "fastapi>=0.110",
    "filelock>=3.13",
    "httpx>=0.27",
    "httpx2>=2.5",
    "starlette>=1.0.0",
    "packaging>=24",
    "pdomain-book-tools>=0.21.0",
    "pdomain-book-contracts>=0.1.0",
    "platformdirs>=4.2",
    "pydantic>=2.5",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5",
    "pystray>=0.19",
    "qtpy>=2;               sys_platform == 'linux'",
    "PyQt6>=6.7;            sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.7;  sys_platform == 'linux'",
]
modal = ["modal>=0.66"]

[project.scripts]
pdomain-ops-schemas = "pdomain_ops.schemas.emit:main"

[project.urls]
Homepage = "https://github.com/pdomain/pdomain-ops"
Source = "https://github.com/pdomain/pdomain-ops"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["pdomain_ops"]

[tool.hatch.build.targets.sdist]
exclude = ["**/.venv", "**/.venv-container"]

[[tool.uv.index]]
name = "pdomain-index-pip"
url = "https://pdomain.github.io/pdomain-index-pip/simple/"
explicit = true

[tool.uv]
required-version = ">=0.11.16"

[tool.uv.sources]
pdomain-book-tools = { index = "pdomain-index-pip" }
pdomain-book-contracts = { index = "pdomain-index-pip" }

[dependency-groups]
dev = [
    "basedpyright>=1.39.4",
    "gitlint>=0.19.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.13",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Preserved research evidence: these files are archived exactly as they were
# produced, so a figure in a findings document can be traced back. Reformatting
# them would defeat that. They are artifacts, not maintained code.
extend-exclude = ["docs/research/evidence"]

[tool.ruff.lint]
select = [
    # Current baseline
    "E", "W",       # pycodestyle errors/warnings
    "F",            # pyflakes
    "I",            # isort (replaces standalone isort)
    "N",            # pep8-naming
    "B",            # flake8-bugbear — mutable defaults, broad excepts, etc.
    "SIM",          # flake8-simplify
    "UP",           # pyupgrade
    "RUF",          # ruff-specific rules
    "ERA",          # eradicate — commented-out code
    "T20",          # flake8-print
    # Added per 2026-05-17 strict-linting decisions
    "ANN",          # flake8-annotations — force type hints on all sigs
    "S",            # flake8-bandit — security rules
    "C4",           # flake8-comprehensions
    "PERF",         # perflint — performance anti-patterns
    "TC",           # flake8-type-checking — move type-only imports to TYPE_CHECKING
    "TID",          # flake8-tidy-imports
    "PT",           # flake8-pytest-style
    "RET",          # flake8-return
    "PL",           # pylint subset (PLC + PLE + PLR + PLW)
    "D",            # pydocstyle
    # Added per 2026-05-17 guidelines audit (BLE/TRY/LOG/G)
    "BLE",          # flake8-blind-except
    "TRY",          # tryceratops — TRY400 enforces log.exception over log.error in except
    "LOG",          # flake8-logging — proper log.* usage
    "G",            # flake8-logging-format — lazy formatting in log calls
    # Added per 2026-07-15 strict-config alignment (FA/PIE/PTH; PLE already in PL)
    "FA",           # flake8-future-annotations
    "PIE",          # flake8-pie — misc lints (useless lambdas, placeholders)
    "PTH",          # flake8-use-pathlib — prefer pathlib over os.path
]
ignore = [
    # Line length: many long docstrings, error messages, and URLs; enforcing
    # 100-char wrapping everywhere adds noise without improving readability.
    "E501",
    # Docstring style: D203 (1-blank-before-class-docstring) conflicts with
    # D211 (no-blank-before-class-docstring); D212 (multi-line-summary-first-line)
    # conflicts with D213 (multi-line-summary-second-line). Pick one of each pair.
    "D203",
    "D212",
    # Missing docstrings on public modules/packages/magic-methods: large
    # existing codebase; add incrementally, not in a single lint sweep.
    "D100",
    "D104",
    "D107",
    # ANN101/ANN102 (self/cls annotations) were removed from ruff >= 0.2;
    # listed here for documentation only — ruff emits a warning if present
    # in the ignore list. Remove if ruff starts hard-failing on unknown rules.
    # PLR0913 (too-many-arguments): OCR/pipeline functions legitimately need many
    # params; enforcing here would require invasive config-object refactors.
    "PLR0913",
    # PLR2004 (magic-value-comparison): common in threshold/port/timeout code.
    "PLR2004",
    # TRY003 (long-message-outside-exception-class): too noisy for a library
    # that uses f-string error messages everywhere.
    "TRY003",
    # COM812 (missing-trailing-comma): conflicts with ruff formatter auto-style.
    "COM812",
    # PLC0415 (import-not-at-top-level): deferred imports are a legitimate
    # pattern — used to break circular deps and avoid loading optional-heavy
    # modules until needed. Suppressing globally.
    "PLC0415",
    # PLR complexity rules: pipeline functions legitimately have high
    # branch/return counts; enforcing these would require invasive refactors.
    "PLR0912",  # too-many-branches
    "PLR0911",  # too-many-return-statements
    "PLR0915",  # too-many-statements
    # ANN401 (dynamically-typed-expressions): some functions legitimately
    # accept/return Any (e.g. JSON deserialisers, generic dispatch helpers).
    "ANN401",
    # D205 (1-blank-line-required-between-summary-and-description): enforcing
    # this across the entire docstring backlog is too noisy for one commit.
    "D205",
    # D105 (missing-docstring-in-magic-method): __repr__, __eq__, etc. are
    # self-documenting; require incrementally on new code only.
    "D105",
    # B008 (function-call-in-default-argument): FastAPI Depends() and Pydantic
    # field() use this pattern legitimately in all route definitions.
    "B008",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pdomain_ops"]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the idiom (S101); magic numbers common (PLR2004); no
# annotations required (ANN); no docstrings required (D); print output is
# allowed in test helpers (T201); security rules
# relaxed (S105/S106/S311 — hardcoded passwords/random are test fixtures);
# pytest.raises match= not required for every test (PT011);
# /tmp paths are fine in tests (S108); trivial comparisons can be intentional (PLR0133);
# loop-var reassignment as pattern (PLW2901); list-building loops in tests are fine (PERF401);
# BLE001: concurrency stress tests collect thread errors via broad except;
# PLW1510: subprocess.run check= omitted intentionally (returncode asserted explicitly);
# SIM117: nested with blocks are clearer for pytest.raises + context combos;
# S603/S607: tests intentionally invoke subprocesses, including trusted tools
# resolved through PATH.
"tests/**/*.py" = ["S101", "S105", "S106", "S311", "T201", "ANN", "D", "PLR2004", "PT011", "S108", "PLR0133", "PLW2901", "PERF401", "BLE001", "PLW1510", "SIM117", "S603", "S607"]
# Scripts: print() is the output mechanism; no docstrings required; S607 partial
# executable path is idiomatic when invoking system tools (uv, git, etc.)
"scripts/*.py" = ["T201", "D", "S607"]
# __init__.py: re-exports without docstrings; F401 and TC keep runtime imports
# available as the public API surface instead of hiding them under TYPE_CHECKING.
"**/__init__.py" = ["D104", "F401", "TC"]
# Private modules: internal convention, no docstrings required.
"**/_*.py" = ["D"]
# GPU device detection: optional-dep probes must catch all exceptions to
# handle any error cupy/torch may raise (ImportError, RuntimeError, etc.).
# S110: try/except/pass is the correct idiom for optional-dep probe fallthrough.
"pdomain_ops/gpu/device.py" = ["BLE001", "S110"]
# SQLite job runner: subprocess.Popen is the mechanism; RUF006 fire-and-forget
# create_task is intentional supervision pattern; BLE001 supervisor catch-all.
"pdomain_ops/gpu/local_jobs.py" = ["BLE001", "S603", "RUF006"]
# Prefs file reader: JSON parse failure treated as empty/default (resilience).
"pdomain_ops/suite/prefs.py" = ["BLE001"]
# Registry file reader: TOML parse failure treated as empty registry (resilience).
# TRY300: try/except structure is the intended read-or-default pattern.
# S112: try/except/continue to skip stale/corrupt entries is intentional.
"pdomain_ops/suite/registry.py" = ["BLE001", "TRY300", "S112"]
# Sibling launcher: subprocess.Popen for app spawning; BLE001 health-poll
# catch-all (httpx + asyncio can raise many exception types); S110 is
# intentional poll-until-healthy loop.
"pdomain_ops/suite/sibling_spawn.py" = ["BLE001", "S603", "S110"]

[tool.basedpyright]
include = ["pdomain_ops", "tests", "scripts"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]

# "strict" is the workspace-canonical mode per the 2026-07-15 decision, which
# overrode the earlier 2026-05-17 choice of "recommended". Strict adds full
# generic-argument checks, implicit-override detection, and unnecessary-ignore
# detection on top of what recommended catches.
typeCheckingMode = "strict"
reportImplicitOverride = true
reportUnnecessaryTypeIgnoreComment = true
# Off (package-wide): FastAPI mounts its route handlers as nested functions
# inside register_* helpers (10+ across suite/*), and strict flags each
# decorator-registered handler as "not accessed". The decorator registration is
# the real use, so this rule is a systematic false positive here. A package-wide
# disable is chosen over 10+ per-handler ignores that would recur on every new
# route. Trade-off: it also silences genuine module-level dead functions, which
# are triaged separately as governed issue reports under docs/issues/.
reportUnusedFunction = false
# Warnings are tracked separately; CI/release gates enforce errors only via
# `basedpyright ... --level error`.
failOnWarnings = false

# Import cycles are structural and resolved via TYPE_CHECKING guards.
# Actual import order issues surface as runtime ImportErrors.
reportImportCycles = "none"

# venvPath/venv are deliberately unset. This workspace names its environment
# ".venv-container" via UV_PROJECT_ENVIRONMENT, so a hardcoded ".venv" silently
# resolves a stale environment: after any merge that changes uv.lock, every new
# third-party symbol reports as a missing attribute until .venv is re-synced.
# Run under `uv run` and basedpyright resolves from the active interpreter.
# Matches pdomain-book-tools, pdomain-ocr-labeler-spa and pdomain-pgdp-measure,
# which unset these for the same reason.

# Per-execution-environment overrides: tests and scripts get more leniency.
# The shipped package (pdomain_ops) runs at the global "strict" mode (2026-07-15
# decision). Tests and scripts are intentionally un-annotated (ruff ignores ANN
# there), so strict's type-inference rules flood them with inferred-Any noise.
# basedpyright ignores a per-environment `typeCheckingMode`, so the equivalent
# of "recommended for tests" is to silence exactly the strict-only inference
# family below. Real type bugs (reportArgumentType, reportCallIssue,
# reportAttributeAccessIssue, ...) stay enforced everywhere.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportPrivateUsage = "none"
reportUnusedFunction = "none"

[[tool.basedpyright.executionEnvironments]]
root = "scripts"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportPrivateUsage = "none"
reportUnusedFunction = "none"

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # loadgroup: honour xdist_group markers so GPU tests land on one worker.
    # Without this, -n auto defaults to load scheduling and ignores xdist_group.
    "--dist=loadgroup",
    "--cov=pdomain_ops",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # GPU tests are serialised onto one xdist worker via tests/gpu/conftest.py.
    # The marker itself is added automatically by the conftest hook; individual
    # test files do not need to apply it manually.
    "xdist_group: route tests to the same xdist worker (pytest-xdist built-in)",
]
filterwarnings = [
    "error",
    # starlette 1.6.0 reads `anyio.abc.BlockingPortal` at import time, an
    # alias anyio 4.15.1 deprecated. Importing the FastAPI test client is
    # enough to raise it and nothing here can avoid that. Matched on the
    # message so every other DeprecationWarning still fails. Drop this once
    # starlette stops reading the deprecated alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # ResourceWarning from subprocess.Popen stdout/stderr PIPE left open
    # until GC in LocalLongJobRunner._supervise — pipes are read once then
    # orphaned by design; closing in finally would race with caller reads.
    "ignore::ResourceWarning",
]
