name: ci

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Chore: review pinned action SHAs weekly. Update the version comment and the
# full commit SHA together after checking the upstream release tag.

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v8.1.0
        with:
          version: "0.12.13"
      - name: Set up Python
        run: uv python install 3.12
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.0.5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.12-${{ hashFiles('pyproject.toml') }}
      - run: make setup
      - run: make pre-commit-check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v8.1.0
        with:
          version: "0.12.13"
      - name: Set up Python
        run: uv python install 3.12
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.0.5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.12-${{ hashFiles('pyproject.toml') }}
      - run: make setup
      - run: make lint-check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v8.1.0
        with:
          version: "0.12.13"
      - name: Set up Python
        run: uv python install 3.12
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.0.5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.12-${{ hashFiles('pyproject.toml') }}
      - run: make setup
      - run: make typecheck

  test:
    name: test / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v8.1.0
        with:
          version: "0.12.13"
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.0.5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - run: make setup
      - run: make test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v8.1.0
        with:
          version: "0.12.13"
      - name: Set up Python
        run: uv python install 3.12
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5.0.5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.12-${{ hashFiles('pyproject.toml') }}
      - run: make setup
      - run: make build
